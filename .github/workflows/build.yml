name: Build APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager --install 'platforms;android-37' 'build-tools;37.0.0'

      - name: Build APK
        run: PLATFORM_JAR="$ANDROID_HOME/platforms/android-37/android.jar" make build

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PathProbe-${{ github.sha }}
          path: build/PathProbe.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: PathProbe-${{ github.sha }}
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/PathProbe.apk
          fail_on_unmatched_files: true
